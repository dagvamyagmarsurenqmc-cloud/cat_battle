<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гүнжээгийн Алдаагүй Муурын Maze</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a18cd1);
            text-align: center;
            color: #333;
            margin: 0;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
        }
        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin: 5px 0; font-size: 24px; }
        .container {
            max-width: 95vw;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #2d3436;
            color: white;
            padding: 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
        }
        #maze-scroll-wrapper {
            max-width: 100%;
            max-height: 60vh;
            overflow: auto;
            background: #1e272e;
            padding: 5px;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border: 3px solid #2d3436;
        }
        .grid {
            display: grid;
            gap: 1px;
            background: #2d3436;
            margin: auto;
        }
        .cell {
            width: 22px;
            height: 22px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .wall { background: #2c3e50; }
        .path { background: #f5f6fa; }
        .start { background: #4cd137; }
        /* Барианы өрөөний өнгийг гоё улаан ягаан болгов */
        .end { background: #ff7675; font-weight: bold; animation: pulse 0.8s infinite alternate; }
        
        @keyframes pulse {
            from { opacity: 0.8; } to { opacity: 1; }
        }
        
        .btn-action {
            background: #e84118;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        #message { font-size: 16px; font-weight: bold; margin: 8px 0; color: #2d3436; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐱 Гүнжээгийн Хурдны Мэйз Battle 🏁</h1>
    <p style="margin: 3px 0; font-size: 14px;">Компьютерын гарны <b>4 Сумтай товчлуураар (▲ ▼ ◀ ▶)</b> муураа удирдаарай!</p>
    
    <div class="stats">
        <div>🆙 Үе: <span id="ui-level">1</span> (<span id="ui-dims">20x20</span>)</div>
        <div>🐟 Оноо: <span id="ui-score">0</span></div>
        <div>🤖 Өрсөлдөгч: <span id="ui-bot">0%</span> ирсэн</div>
    </div>

    <div id="message">Гарны сумаар хурдан хөдөлж барианд (🚩) хүрээрэй!</div>

    <div id="maze-scroll-wrapper">
        <div id="maze" class="grid"></div>
    </div>

    <button class="btn-action" onclick="restartGame()">Шинээр эхлэх 🔄</button>
</div>

<script>
    let level = 1;
    let score = 0;
    let catPos = { x: 1, y: 1 };
    let mazeSize = 20;
    let map = [];
    let botProgress = 0;
    let botTimer = null;
    let gameActive = true;

    function generateMaze(size) {
        let matrix = Array(size).fill().map(() => Array(size).fill(1));
        
        function walk(cx, cy) {
            matrix[cy][cx] = 0;
            let dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
            
            for (let [dx, dy] of dirs) {
                let nx = cx + dx, ny = cy + dy;
                if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && matrix[ny][nx] === 1) {
                    matrix[cy + dy/2][cx + dx/2] = 0;
                    walk(nx, ny);
                }
            }
        }
        
        walk(1, 1);
        
        // ЭХЛЭЛ ХЭСЭГ
        matrix[1][1] = 'S';
        
        // БАРИАГ ЗАВAЛ НЭЭЛТТЭЙ ЦАГААН ЗАМ ДЭЭР ТАВИХ ЗАСВАР:
        // Баруун доод булангийн хамгийн ойрхон байгаа цагаан замыг хайж олно
        let endX = size - 2;
        let endY = size - 2;
        let found = false;

        for (let d = 0; d < size; d++) {
            for (let i = 0; i <= d; i++) {
                let x = size - 2 - i;
                let y = size - 2 - (d - i);
                if (x > 0 && y > 0 && matrix[y][x] === 0) {
                    endX = x;
                    endY = y;
                    found = true;
                    break;
                }
            }
            if (found) break;
        }
        
        matrix[endY][endX] = 'E'; // Одоо бариа завал зам дээр байна!
        
        // Загас хулгана цацах
        for(let y=1; y<size-1; y++) {
            for(let x=1; x<size-1; x++) {
                if(matrix[y][x] === 0 && Math.random() < 0.08) {
                    matrix[y][x] = Math.random() > 0.4 ? 'F' : 'M';
                }
            }
        }
        return matrix;
    }

    function initGame() {
        gameActive = true;
        if (level === 1) mazeSize = 20;
        else if (level === 2) mazeSize = 30;
        else if (level === 3) mazeSize = 50;

        document.getElementById('ui-level').innerText = level;
        document.getElementById('ui-dims').innerText = `${mazeSize}x${mazeSize}`;
        document.getElementById('ui-score').innerText = score;
        document.getElementById('ui-bot').innerText = "0%";
        document.getElementById('message').innerText = `Гарны сумаар гүйгээрэй! Өрсөлдөгч хөөж байгаа шүү!`;

        map = generateMaze(mazeSize);
        catPos = { x: 1, y: 1 };
        botProgress = 0;

        renderMaze();
        scrollCenter();

        if(botTimer) clearInterval(botTimer);
        let botIntervalTime = 1500 + (level * 500); 
        botTimer = setInterval(() => {
            if(!gameActive) return;
            botProgress += Math.floor(Math.random() * 3) + 1;
            if(botProgress > 100) botProgress = 100;
            document.getElementById('ui-bot').innerText = botProgress + "%";
            
            if(botProgress >= 100) {
                endGame(false);
            }
        }, botIntervalTime);
    }

    function renderMaze() {
        const mazeContainer = document.getElementById('maze');
        mazeContainer.style.gridTemplateColumns = `repeat(${mazeSize}, 22px)`;
        mazeContainer.innerHTML = '';

        for (let y = 0; y < mazeSize; y++) {
            for (let x = 0; x < mazeSize; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                let tile = map[y][x];
                
                if (tile === 1) cell.className = 'cell wall';
                else if (tile === 0) cell.className = 'cell path';
                else if (tile === 'S') cell.className = 'cell start';
                else if (tile === 'E') { cell.className = 'cell end'; cell.innerText = '🚩'; }
                else if (tile === 'F') { cell.className = 'cell path'; cell.innerText = '🐟'; }
                else if (tile === 'M') { cell.className = 'cell path'; cell.innerText = '🐭'; }
                
                if (catPos.x === x && catPos.y === y) {
                    cell.innerText = '🐱';
                    cell.style.backgroundColor = '#ffe6f2';
                }
                mazeContainer.appendChild(cell);
            }
        }
    }

    function moveCat(dx, dy) {
        if (!gameActive) return;

        let newX = catPos.x + dx;
        let newY = catPos.y + dy;

        if (newX >= 0 && newX < mazeSize && newY >= 0 && newY < mazeSize) {
            if (map[newY][newX] !== 1) { 
                catPos.x = newX;
                catPos.y = newY;
                
                if (map[newY][newX] === 'F') {
                    score += 15;
                    map[newY][newX] = 0;
                    document.getElementById('message').innerText = "Загас идлээ! +15 оноо 🐟";
                } else if (map[newY][newX] === 'M') {
                    score += 25;
                    map[newY][newX] = 0;
                    document.getElementById('message').innerText = "Хулгана барилаа! +25 оноо 🐭";
                }
                
                document.getElementById('ui-score').innerText = score;
                renderMaze();
                scrollCenter();
                
                if (map[newY][newX] === 'E') {
                    endGame(true);
                }
            }
        }
    }

    function scrollCenter() {
        const wrapper = document.getElementById('maze-scroll-wrapper');
        let targetX = catPos.x * 23 - wrapper.clientWidth / 2;
        let targetY = catPos.y * 23 - wrapper.clientHeight / 2;
        wrapper.scrollLeft = targetX;
        wrapper.scrollTop = targetY;
    }

    function endGame(isCatWin) {
        gameActive = false;
        clearInterval(botTimer);
        const msg = document.getElementById('message');
        
        if (isCatWin) {
            if (level < 3) {
                msg.innerHTML = `<span style="color:#4cd137;">🎉 ЯЛЛАА! Гүнжээ барианд орлоо! Одоо дараагийн үе рүү...</span>`;
                setTimeout(() => {
                    level++;
                    initGame();
                }, 2000);
            } else {
                msg.innerHTML = `<span style="color:#fbc531;">🏆 СУПЕР ГҮНЖЭЭ! Сүүлчийн асар том төөрдөг байшинг дуусгаж ЯЛАГЧ боллоо! 🎉</span>`;
            }
        } else {
            msg.innerHTML = `<span style="color:#e84118;">😿 Робот түрүүлчихлээ. Гэхдээ "Шинээр эхлэх" дараад дахин үзээрэй!</span>`;
        }
    }

    function restartGame() {
        level = 1;
        score = 0;
        initGame();
    }

    window.addEventListener('keydown', function(e) {
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) > -1) {
            e.preventDefault();
        }
        if(e.key === "ArrowUp")   moveCat(0, -1);
        if(e.key === "ArrowDown") moveCat(0, 1);
        if(e.key === "ArrowLeft") moveCat(-1, 0);
        if(e.key === "ArrowRight") moveCat(1, 0);
    });

    window.onload = initGame;
</script>

</body>
</html>
